spring.application.name=blockchain-service
server.port=8082

# Blockchain Configuration
blockchain.chain.id=1
blockchain.group.id=group0

# FISCO BCOS 3.11 SDK Configuration - Local node5 + Remote server nodes
# FISCO BCOS 3.x uses different port scheme: RPC port for SDK connection
blockchain.sdk.cert-path=/Users/hqsk/Work/kxdex/DEX/sdk
blockchain.sdk.peers=127.0.0.1:20205,192.168.120.32:20200,192.168.120.32:20201,192.168.120.32:20202,192.168.120.32:20203,192.168.120.32:20204
